name: 🚀 YouTube Shorts Daily Automation

on:
  schedule:
    # Setiap hari pukul 23:45 UTC = 06:45 WIB (menghindari jam padat untuk meminimalkan delay)
    - cron: '45 23 * * *'

  # Bisa trigger manual dari GitHub Actions tab
  workflow_dispatch:
    inputs:
      category:
        description: 'Override kategori (kosongkan untuk otomatis)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (test tanpa upload ke YouTube)'
        type: boolean
        required: false
        default: false
      max_videos:
        description: 'Jumlah video per hari (default: 2)'
        required: false
        default: '2'

jobs:
  generate-shorts:
    name: Generate & Upload YouTube Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./meteorit-youtube

    steps:
      # ─── Checkout & Setup ───────────────────────────────────
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: meteorit-youtube/package-lock.json

      # ─── Install Dependencies ───────────────────────────────
      - name: 📚 Install Node Dependencies
        run: npm ci

      # ─── Install FFmpeg & Fonts ─────────────────────────────
      - name: 🎬 Install FFmpeg & Indonesian Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-cjk
          ffmpeg -version | head -n 1
          echo "✅ FFmpeg ready"
          fc-list | grep -i noto | head -5
          echo "✅ Fonts ready"

      # ─── Download Background Music ──────────────────────────
      - name: 🎵 Download Background Music
        run: |
          mkdir -p src/assets/music
          curl -L "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" -o src/assets/music/space-ambient-1.mp3
          curl -L "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" -o src/assets/music/space-ambient-2.mp3
          curl -L "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" -o src/assets/music/space-ambient-3.mp3
          echo "✅ Background music downloaded"

      # ─── Verify Assets ──────────────────────────────────────
      - name: 📁 Check Assets
        run: |
          echo "=== Assets Directory ==="
          ls -la src/assets/ 2>/dev/null || echo "⚠️ assets dir tidak ada"
          ls -la src/assets/music/ 2>/dev/null || echo "⚠️ music dir tidak ada"
          ls -la src/assets/fonts/ 2>/dev/null || echo "⚠️ fonts dir tidak ada"
          ls -la src/assets/logo/ 2>/dev/null || echo "⚠️ logo dir tidak ada"

      # ─── Run Main Script ────────────────────────────────────
      - name: 🎬 Generate & Upload YouTube Shorts
        env:
          # Cloudflare R2
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

          # NASA API
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

          # Groq AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_BACKUP_API_KEY: ${{ secrets.GROQ_BACKUP_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # YouTube OAuth
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Cloudflare D1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

          # Config
          MAX_VIDEOS_PER_DAY: ${{ github.event.inputs.max_videos || '2' }}
          VIDEO_DURATION_SEC: '55'
          SITE_URL: 'https://www.meteorit.my.id'
          YOUTUBE_CHANNEL_URL: 'https://www.youtube.com/@Meteorit-h7d'
          NODE_ENV: 'production'
          CATEGORY_OVERRIDE: ${{ github.event.inputs.category }}

        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "🟡 Mode: DRY RUN"
          fi

          node main.js $DRY_RUN_FLAG

      # ─── Upload Video Artifacts (Debug) ─────────────────────
      - name: 📤 Upload Output Artifacts (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_number }}
          path: meteorit-youtube/out/
          if-no-files-found: ignore
          retention-days: 3

      # ─── Summary ────────────────────────────────────────────
      - name: 📊 Job Summary
        if: always()
        run: |
          echo "## 🎬 YouTube Shorts Automation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Tanggal | $(TZ='Asia/Jakarta' date '+%d %B %Y %H:%M WIB') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 Max Videos | ${{ github.event.inputs.max_videos || '2' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Mode | ${{ github.event.inputs.dry_run == 'true' && 'Dry Run' || 'Production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Channel | [@Meteorit-h7d](https://www.youtube.com/@Meteorit-h7d) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 Website | [meteorit.my.id](https://www.meteorit.my.id) |" >> $GITHUB_STEP_SUMMARY
